# Publishes the static site (landing + docs) to GitHub Pages at loreholm.com.
# Deliberately excludes the dashboard pages (dashboard.html, dashboard.js,
# api-keys.js) — they need the API, which is not publicly deployed during
# development. They ship with the full stack at launch instead.
name: Publish Site

on:
  push:
    branches: ["main", "v2"]
    paths:
      - "web/**"
      - "apps/docs-v2/**"
      - "docs/**"
      - "notes/Architecture-Decisions.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/docs-v2/package.json

      - name: Install documentation dependencies
        working-directory: apps/docs-v2
        run: npm install --no-audit --no-fund

      - name: Build documentation atlas
        working-directory: apps/docs-v2
        run: npm run build

      - name: Assemble static site
        run: |
          mkdir -p _site
          # Keep the coming-soon page at the root while making the V2 atlas
          # available at /docs/.
          cp web/coming-soon.html _site/index.html
          cp -a web/docs _site/docs
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
