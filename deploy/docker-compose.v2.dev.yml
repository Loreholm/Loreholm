services:
  vllm:
    image: ${VLLM_IMAGE:-nvcr.io/nvidia/vllm:25.11-py3}
    restart: unless-stopped
    ipc: host
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${HF_CACHE_DIR:-/home/kevin/.cache/huggingface}:/models:ro
    command:
      - vllm
      - serve
      - ${VLLM_MODEL:-Qwen/Qwen3-8B}
      - --served-model-name
      - ${VLLM_SERVED_MODEL:-loreholm-local}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --max-model-len
      - ${VLLM_MAX_MODEL_LEN:-32768}
      - --gpu-memory-utilization
      - ${VLLM_GPU_MEMORY_UTILIZATION:-0.25}
      - --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/v1/models >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
